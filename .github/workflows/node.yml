
name: NASA Project CI

on:
  push:
    branches: [main]
    paths:
      - 'node/nasa-project/**'
      - '.github/workflows/node.yml'

  pull_request:
    branches: [main]
    paths:
      - 'node/nasa-project/**'
      - '.github/workflows/node.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CI: true
      MONGODB_DB_URI: mongodb://127.0.0.1:27017/nasa

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        mongodb-version: ['8.0']

    defaults:
      run:
        working-directory: node/nasa-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js version ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Install dependencies
        run: npm install

      - name: Build client
        run: npm run build --prefix client
      - name: Check MongoDB environment variable
        run: |
          if [ -z "$MONGODB_DB_URI" ]; then
            echo "MONGODB_DB_URI is missing"
            exit 1
          else
            echo "MONGODB_DB_URI is configured"
          fi
      - name: Run tests
        run: npm test
